<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cloudGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e0f2fe;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#bae6fd;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Rain effect -->
  <line x1="150" y1="50" x2="140" y2="120" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="250" y1="80" x2="240" y2="150" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="350" y1="30" x2="340" y2="100" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="450" y1="60" x2="440" y2="130" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="550" y1="40" x2="540" y2="110" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="650" y1="70" x2="640" y2="140" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="750" y1="50" x2="740" y2="120" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="850" y1="35" x2="840" y2="105" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="950" y1="65" x2="940" y2="135" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  <line x1="1050" y1="45" x2="1040" y2="115" stroke="#93c5fd" stroke-width="2" opacity="0.6"/>
  
  <!-- Cloud shape -->
  <circle cx="200" cy="100" r="40" fill="url(#cloudGradient)"/>
  <circle cx="240" cy="100" r="50" fill="url(#cloudGradient)"/>
  <circle cx="280" cy="100" r="40" fill="url(#cloudGradient)"/>
  
  <circle cx="900" cy="120" r="35" fill="url(#cloudGradient)"/>
  <circle cx="935" cy="120" r="45" fill="url(#cloudGradient)"/>
  <circle cx="970" cy="120" r="35" fill="url(#cloudGradient)"/>
  
  <!-- Main content container -->
  <rect x="100" y="220" width="1000" height="300" rx="20" fill="white" opacity="0.95"/>
  
  <!-- Icon/Emoji -->
  <text x="150" y="330" font-size="80" fill="#3b82f6">🌧️</text>
  
  <!-- Title -->
  <text x="280" y="310" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#1e3a8a">
    Mazhai Mitra
  </text>
  
  <!-- Tamil subtitle -->
  <text x="280" y="360" font-family="Arial, sans-serif" font-size="32" fill="#3b82f6">
    மழை மித்ரா
  </text>
  
  <!-- Description -->
  <text x="280" y="410" font-family="Arial, sans-serif" font-size="28" fill="#475569">
    Tamil Rain Safety Assistant
  </text>
  
  <!-- Tech badges -->
  <rect x="150" y="450" width="180" height="40" rx="20" fill="#f97316"/>
  <text x="240" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    Strands SDK
  </text>
  
  <rect x="350" y="450" width="200" height="40" rx="20" fill="#8b5cf6"/>
  <text x="450" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    Amazon Bedrock
  </text>
  
  <rect x="570" y="450" width="150" height="40" rx="20" fill="#06b6d4"/>
  <text x="645" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    Streamlit
  </text>
  
  <rect x="740" y="450" width="100" height="40" rx="20" fill="#10b981"/>
  <text x="790" y="478" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle">
    AI
  </text>
  
  <!-- Risk level indicators -->
  <circle cx="900" cy="470" r="15" fill="#22c55e"/>
  <circle cx="935" cy="470" r="15" fill="#eab308"/>
  <circle cx="970" cy="470" r="15" fill="#f97316"/>
  <circle cx="1005" cy="470" r="15" fill="#ef4444"/>
  
  <!-- Footer -->
  <text x="600" y="600" font-family="Arial, sans-serif" font-size="22" fill="#cbd5e1" text-anchor="middle">
    AI-Powered Bilingual Rain &amp; Flood Safety Guidance
  </text>
</svg>
